version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    ignore:
      # Upgrade with GTK/WebKitGTK: their public APIs expose Cairo 0.22 types.
      - dependency-name: cairo-rs
        versions: [">=0.23"]

  - package-ecosystem: npm
    directories:
      - /tests/site/frameworks
      - /benchmarks
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
