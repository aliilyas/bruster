name: paired performance

on:
  push:
    branches: ['perf/**']
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline revision
        default: v0.3.5
        required: true
      rounds:
        description: Alternating pairs per transport (20 minimum for publication)
        default: '20'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      BASELINE: ${{ inputs.baseline || 'v0.3.5' }}
      ROUNDS: ${{ inputs.rounds || '20' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: paired-performance-${{ matrix.os }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb xauth fonts-dejavu-core
      - name: Build both revisions with the same toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/performance"
          git rev-parse HEAD > "$RUNNER_TEMP/performance/candidate-commit.txt"
          git rev-parse "$BASELINE^{commit}" > "$RUNNER_TEMP/performance/baseline-commit.txt"
          rustc -Vv > "$RUNNER_TEMP/performance/rustc.txt"
          if [ "$RUNNER_OS" = Linux ]; then dpkg-query -W > "$RUNNER_TEMP/performance/packages.txt"; fi
          git worktree add --detach "$RUNNER_TEMP/performance-baseline" "$BASELINE"
          # Same-name/path-shaped packages can share Cargo fingerprints even
          # across worktrees. Never build different sources into one target dir.
          CARGO_TARGET_DIR="$RUNNER_TEMP/performance-baseline-target" \
            cargo build --release --locked --manifest-path "$RUNNER_TEMP/performance-baseline/Cargo.toml"
          cp "$RUNNER_TEMP/performance-baseline-target/release/bruster" "$RUNNER_TEMP/baseline-bruster"
          cargo build --release --locked
          cp target/release/bruster "$RUNNER_TEMP/candidate-bruster"
      - name: Native correctness checks
        run: |
          cargo test --release --locked --bin bruster
          if [ "$RUNNER_OS" = Linux ]; then set -- xvfb-run -a; else set --; fi
          "$@" cargo test --release --locked --no-fail-fast --test smoke --test edge -- --test-threads=1
          "$@" python3 scripts/test_lab.py run --binary target/release/bruster --transport both --case 'screenshot-*' \
            --site-dir "$RUNNER_TEMP/performance/pixel-fixtures" --output "$RUNNER_TEMP/performance/pixel-checks"
          cmp target/release/bruster "$RUNNER_TEMP/candidate-bruster"
      - name: Alternating JSONL and MCP workloads
        run: |
          if [ "$RUNNER_OS" = Linux ]; then set -- xvfb-run -a; else set --; fi
          "$@" python3 scripts/bench_optimizations.py \
            --baseline "$RUNNER_TEMP/baseline-bruster" --candidate "$RUNNER_TEMP/candidate-bruster" \
            --rounds "$ROUNDS" --output "$RUNNER_TEMP/performance/paired"
      - name: Report and retain evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/performance/paired/report.md" ]; then
            cat "$RUNNER_TEMP/performance/paired/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: paired-performance-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/performance/
          retention-days: 90
