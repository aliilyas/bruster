name: launch assets
on:
  workflow_dispatch:
    inputs:
      source:
        description: Capture the checkout or a published release
        type: choice
        options: [checkout, release]
        default: checkout
        required: true
      version:
        description: Published release version (without v; only used for release captures)
        default: '0.3.2'
        required: false
  pull_request:
    paths:
      - '.github/workflows/launch-assets.yml'
      - 'scripts/launch_media.py'
      - 'scripts/package_mcp.py'
      - 'examples/launch-demo/**'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb fonts-dejavu-core ffmpeg
          python -m pip install Pillow==12.0.0
      - uses: dtolnay/rust-toolchain@stable
        if: inputs.source != 'release'
      - uses: Swatinem/rust-cache@v2
        if: inputs.source != 'release'
      - name: Build and test the checkout
        if: inputs.source != 'release'
        run: |
          cargo build --release --locked --tests
          xvfb-run -a cargo test --release --locked --no-fail-fast --bin bruster --test smoke --test edge --test test_lab -- --test-threads=1
      - name: Capture the checked-out MCP server
        if: inputs.source != 'release'
        run: |
          xvfb-run -a python scripts/launch_media.py demo --output "$RUNNER_TEMP/demo" --source-revision "$(git rev-parse HEAD)" target/release/bruster
      - name: Download and verify the release; build the MCP bundle
        if: inputs.source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || '0.3.2' }}
        run: |
          gh release download "v$VERSION" --repo aliilyas/bruster --dir "$RUNNER_TEMP/release"
          python scripts/package_mcp.py --release-dir "$RUNNER_TEMP/release" --version "$VERSION" --output "$RUNNER_TEMP/mcp"
          python - "$RUNNER_TEMP/mcp/bruster-$VERSION.mcpb" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/release" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          root = pathlib.Path(sys.argv[2])
          bundle = pathlib.Path(sys.argv[1])
          release = pathlib.Path(sys.argv[3])
          published = release / bundle.name
          if published.exists():
              metadata = json.loads((release / 'server.json').read_text())
              expected = next(p['fileSha256'] for p in metadata['packages'] if p['identifier'].endswith('/' + bundle.name))
              assert hashlib.sha256(published.read_bytes()).hexdigest() == expected
              bundle = published
          print('Capturing with:', bundle.name, hashlib.sha256(bundle.read_bytes()).hexdigest())
          with zipfile.ZipFile(bundle) as archive:
              archive.extractall(root)
              for item in archive.infolist():
                  (root / item.filename).chmod((item.external_attr >> 16) & 0o777)
          PY
      - name: Exercise the packaged MCP server and capture the demo
        if: inputs.source == 'release'
        run: |
          xvfb-run -a python scripts/launch_media.py demo --output "$RUNNER_TEMP/demo" "$RUNNER_TEMP/bundle/server/bruster"
      - uses: actions/upload-artifact@v4
        with:
          name: launch-assets
          path: |
            ${{ runner.temp }}/demo/
            ${{ runner.temp }}/mcp/
          if-no-files-found: error
