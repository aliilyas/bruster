name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * *' # Daily at 06:23 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit dependencies against RustSec
        run: cargo audit --file Cargo.lock
