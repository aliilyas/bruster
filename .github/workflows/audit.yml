name: Dependency audit

on:
  push:
  pull_request:
  schedule:
    - cron: '23 6 * * *' # Daily at 06:23 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit
      - name: Audit dependencies against RustSec
        shell: bash
        run: cargo audit --file Cargo.lock 2>&1 | tee cargo-audit.txt
      - name: Retain audit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-audit-results
          path: cargo-audit.txt
          retention-days: 30
