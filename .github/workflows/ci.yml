# Build and test on every platform bruster ships for; publish archives on a tag.
#
#   macOS arm64 / x86_64   native WKWebView, tests run on the runner's desktop
#   Ubuntu x86_64 / arm64  WebKitGTK 4.1, tests under xvfb-run
#   Windows x86_64         WebView2, unit/smoke/edge tests
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,       test: full }
          # Intel runners are scarce; the arm64 runner cross-compiles and runs the tests under Rosetta.
          - { os: macos-14,         target: x86_64-apple-darwin,        test: full }
          - { os: ubuntu-24.04,     target: x86_64-unknown-linux-gnu,   test: full }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  test: full }
          - { os: windows-2022,     target: x86_64-pc-windows-msvc,     test: unit }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb fonts-dejavu-core dbus python3-dbus python3-gi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Unit tests
        run: cargo test --release --locked --target ${{ matrix.target }} --bin bruster

      - name: Startup with an unresponsive desktop portal (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a /usr/bin/python3 tests/startup_portal.py target/${{ matrix.target }}/release/bruster

      - name: Smoke and edge tests (Linux)
        if: runner.os == 'Linux' && matrix.test == 'full'
        env:
          BRUSTER_TEST_STDERR: 1
          BRUSTER_TRACE_NAV: 1
        run: xvfb-run -a cargo test --release --locked --target ${{ matrix.target }} --test smoke --test edge

      - name: Diagnostics (macOS, stderr of one navigate)
        if: runner.os == 'macOS'
        run: |
          (printf '%s\n' '{"id":1,"method":"navigate","params":{"url":"https://example.com/"}}'; sleep 5; printf '%s\n' '{"id":2,"method":"title"}' '{"id":3,"method":"close"}'; sleep 2) \
            | target/${{ matrix.target }}/release/bruster --hidden 2>&1 | head -60 || true
          echo "exit: ${PIPESTATUS[1]}"
          (printf '%s\n' '{"id":1,"method":"title"}' '{"id":2,"method":"close"}'; sleep 2) \
            | target/${{ matrix.target }}/release/bruster --hidden --profile /tmp/diagprof 2>&1 | head -20 || true

      - name: Smoke and edge tests (macOS)
        if: runner.os == 'macOS' && matrix.test == 'full'
        env: { BRUSTER_TEST_STDERR: 1 }
        run: cargo test --release --locked --target ${{ matrix.target }} --test smoke --test edge -- --nocapture

      - name: Repeat navigation race regression (macOS)
        if: runner.os == 'macOS'
        env: { BRUSTER_TEST_STDERR: 1 }
        run: |
          for round in {1..10}; do
            echo "Navigation regression round $round"
            cargo test --release --locked --target ${{ matrix.target }} --test edge -- --exact duplicate_load_does_not_release_requests_for_the_next_page queued_page_requests_expire_without_running_after_navigation same_url_replacement_loads_the_new_document old_document_cannot_finish_the_new_pages_idle_wait --nocapture --test-threads=1 || exit 1
          done

      - name: Smoke tests (Windows)
        if: runner.os == 'Windows'
        env:
          BRUSTER_TEST_STDERR: 1
          BRUSTER_TRACE_NAV: 1
        run: cargo test --release --locked --target ${{ matrix.target }} --test smoke -- --test-threads=1

      - name: Edge tests (Windows)
        if: runner.os == 'Windows'
        env:
          BRUSTER_TEST_STDERR: 1
          BRUSTER_TRACE_NAV: 1
        run: cargo test --release --locked --target ${{ matrix.target }} --test edge -- --test-threads=1

      - name: Repeat queued native starts (Windows)
        if: runner.os == 'Windows'
        env:
          BRUSTER_TEST_STDERR: 1
          BRUSTER_TRACE_NAV: 1
        run: |
          for ($round = 1; $round -le 5; $round++) {
            cargo test --release --locked --target ${{ matrix.target }} --test edge -- --exact navigate_times_out_and_is_superseded same_url_replacement_loads_the_new_document --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: MCP launch check
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/bruster
          if [ "$RUNNER_OS" = Linux ]; then set -- xvfb-run -a "$BIN"; else set -- "$BIN"; fi
          sh tests/mcp_launch.sh "$@" --hidden --mcp --quiet

      - name: Package
        shell: bash
        run: |
          set -e
          ver=${GITHUB_REF_NAME#v}
          ver=${ver//\//-}
          dir=bruster-${ver}-${{ matrix.target }}
          mkdir -p "$dir"
          cp README.md LICENSE* "$dir"/ 2>/dev/null || cp README.md "$dir"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/${{ matrix.target }}/release/bruster.exe "$dir"/
            7z a "$dir.zip" "$dir" > /dev/null
          else
            cp target/${{ matrix.target }}/release/bruster "$dir"/
            cp bin/bruster "$dir"/bruster-run
            tar czf "$dir.tar.gz" "$dir"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bruster-${{ matrix.target }}
          path: |
            bruster-*.tar.gz
            bruster-*.zip
          if-no-files-found: error

  e2e:
    # Exercise public sites in both WebKitGTK and native Windows WebView2.
    name: e2e (public sites, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb fonts-dejavu-core
      - name: Public-site tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --release --locked --test e2e -- --ignored --test-threads=2
      - name: Public-site tests (Windows)
        if: runner.os == 'Windows'
        env:
          BRUSTER_TEST_STDERR: 1
          BRUSTER_TRACE_NAV: 1
        run: cargo test --release --locked --test e2e -- --ignored --test-threads=1

  integrations:
    # MCP clients other than our own harness: TypeScript SDK, Python SDK, Inspector CLI.
    name: MCP client integrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb fonts-dejavu-core
      - run: cargo build --release --locked
      - run: xvfb-run -a sh tests/integrations.sh target/release/bruster

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist && (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
