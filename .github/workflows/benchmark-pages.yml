name: benchmark pages

on:
  push:
    branches: [main]
    paths:
      - 'tests/site/**'
      - 'example-tests/**'
      - 'examples/launch-demo/**'
      - 'scripts/lab/**'
      - 'scripts/test_lab.py'
      - 'scripts/test_lab_check.mjs'
      - 'scripts/test_test_lab.py'
      - 'site/**'
      - 'assets/logo.svg'
      - 'scripts/site_*.py'
      - 'scripts/test_site_*.py'
      - 'scripts/bench_report.*'
      - 'scripts/bench_tools.py'
      - 'benchmarks/competitors.json'
      - 'docs/**'
      - 'Cargo.toml'
      - '.github/workflows/benchmark-pages.yml'
  pull_request:
    paths:
      - 'tests/site/**'
      - 'example-tests/**'
      - 'examples/launch-demo/**'
      - 'scripts/lab/**'
      - 'scripts/test_lab.py'
      - 'scripts/test_lab_check.mjs'
      - 'scripts/test_test_lab.py'
      - 'site/**'
      - 'assets/logo.svg'
      - 'scripts/site_*.py'
      - 'scripts/test_site_*.py'
      - 'scripts/bench_report.*'
      - 'scripts/bench_tools.py'
      - 'benchmarks/competitors.json'
      - 'docs/**'
      - 'Cargo.toml'
      - '.github/workflows/benchmark-pages.yml'
  # GITHUB_TOKEN pushes do not start another push workflow. workflow_run does.
  workflow_run:
    workflows: [benchmarks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check site and publication contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_site_*.py'
          python3 -m unittest discover -s scripts -p 'test_bench_publish.py'
          python3 -m unittest discover -s scripts -p 'test_test_lab.py'
      - name: Build preview without measurements
        run: python3 scripts/site_build.py --output "$RUNNER_TEMP/site-preview"
  deploy:
    # gh-pages contains only validated Linux measurements. A failure in the
    # separate macOS cohort must not prevent deploying those published records.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Always read the latest branches. An older benchmark completion must not
      # put stale source or measurements back on the live site.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: _measurements
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/site/frameworks/package-lock.json
      - name: Build pinned framework fixtures
        run: |
          npm ci --prefix tests/site/frameworks --ignore-scripts --no-audit --no-fund
          node tests/site/frameworks/build.mjs "$RUNNER_TEMP/lab-frameworks"
      - name: Check site and publication contracts
        run: |
          python3 -m unittest discover -s scripts -p 'test_site_*.py'
          python3 -m unittest discover -s scripts -p 'test_bench_publish.py'
          python3 -m unittest discover -s scripts -p 'test_test_lab.py'
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build website with published measurements
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/site_build.py --measurements _measurements --output _site --base-url "$SITE_URL"
      - name: Assemble website, benchmarks, and test lab
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/test_lab.py assemble --existing _site --output published --frameworks "$RUNNER_TEMP/lab-frameworks" --base-url "$SITE_URL"
          node scripts/test_lab_check.mjs published/test-lab
      - uses: actions/upload-pages-artifact@v5
        with:
          path: published
      - uses: actions/deploy-pages@v5
        id: deployment
