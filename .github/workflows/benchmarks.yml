name: benchmarks

on:
  # A merge (including squash/rebase) updates main. Direct pushes are measured too.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Deliberately no concurrency group: GitHub replaces pending runs in a group,
# even with cancel-in-progress: false. Every merge must retain its measurement.
jobs:
  macos-timing:
    if: github.ref == 'refs/heads/main'
    # SleepyHollow requires Swift 6.3; macos-15 defaults to Xcode 16.4.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks-macos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Bruster and record SleepyHollow source
        run: |
          mkdir -p "$RUNNER_TEMP/macos-benchmark-results"
          cargo build --release --locked
          git clone --depth 1 https://github.com/bensyverson/sleepyhollow.git "$RUNNER_TEMP/sleepyhollow"
          git -C "$RUNNER_TEMP/sleepyhollow" rev-parse HEAD > "$RUNNER_TEMP/macos-benchmark-results/sleepyhollow-commit.txt"
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          swift --version > "$RUNNER_TEMP/macos-benchmark-results/swift-version.txt"
          swift build --package-path "$RUNNER_TEMP/sleepyhollow" -c release
          printf 'SLEEPY_BINARY=%s/sleepy\n' "$(swift build --package-path "$RUNNER_TEMP/sleepyhollow" -c release --show-bin-path)" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/sleepyhollow/Package.resolved" "$RUNNER_TEMP/macos-benchmark-results/"
      - name: Compare on the same Mac
        run: |
          python3 scripts/bench_sleepyhollow.py \
            --bruster target/release/bruster --sleepy "$SLEEPY_BINARY" \
            --sleepy-source "$RUNNER_TEMP/sleepyhollow" --output "$RUNNER_TEMP/macos-benchmark-results" \
            --rounds 10 --iterations 10
          cat "$RUNNER_TEMP/macos-benchmark-results/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain macOS timings and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-benchmarks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macos-benchmark-results/
          retention-days: 90

  measure:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: Set benchmark paths
        run: |
          printf 'PLAYWRIGHT_BROWSERS_PATH=%s\nBENCH_DEPS=%s\nRESULTS=%s\n' \
            "$RUNNER_TEMP/benchmark-browsers" "$RUNNER_TEMP/benchmark-deps" "$RUNNER_TEMP/benchmark-results" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmarks-linux-x86_64
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve latest stable Node.js
        id: node
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          with urllib.request.urlopen('https://nodejs.org/dist/index.json', timeout=30) as response:
              releases = json.load(response)
          versions = [release['version'][1:] for release in releases
                      if re.fullmatch(r'v\d+\.\d+\.\d+', release['version'])
                      and 'linux-x64' in release['files']]
          version = max(versions, key=lambda value: tuple(map(int, value.split('.'))))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          print(f'Latest stable Node.js: {version}')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          check-latest: true
      - name: Check publication logic
        run: python3 -m unittest discover -s scripts -p 'test_bench_*.py'
      - name: Install runtimes
        run: |
          mkdir -p "$RESULTS" "$BENCH_DEPS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb xauth fonts-dejavu-core
          cp benchmarks/package.json "$BENCH_DEPS/package.json"
          npm install --prefix "$BENCH_DEPS" --save-exact --prefer-online --ignore-scripts --no-audit --no-fund \
            playwright-core@latest puppeteer-core@latest agent-browser@latest \
            @browserbasehq/stagehand@latest browse@latest @playwright/mcp@latest @modelcontextprotocol/sdk@latest \
            cypress@latest uivision-mcp-bridge@latest rustwright@latest rustwright-mcp@latest biloba@latest
          cp "$BENCH_DEPS/package.json" "$BENCH_DEPS/package-lock.json" "$RESULTS/"
          chmod +x "$BENCH_DEPS/node_modules/agent-browser/bin/agent-browser-linux-x64"
          node "$BENCH_DEPS/node_modules/playwright-core/cli.js" install --with-deps chromium --no-shell
          node "$BENCH_DEPS/node_modules/playwright-core/cli.js" install chromium-headless-shell
          export CYPRESS_CACHE_FOLDER="$BENCH_DEPS/cypress-cache"
          node "$BENCH_DEPS/node_modules/cypress/bin/cypress" install
          node "$BENCH_DEPS/node_modules/cypress/bin/cypress" verify
          node benchmarks/browser-paths.mjs "$BENCH_DEPS" > "$BENCH_DEPS/browser-paths.env"
          cat "$BENCH_DEPS/browser-paths.env" >> "$GITHUB_ENV"
          source "$BENCH_DEPS/browser-paths.env"
          python3 scripts/bench_install_uivision.py --chrome "$BENCH_CHROME" --deps "$BENCH_DEPS"
          cp "$BENCH_DEPS/uivision-provenance.json" "$RESULTS/"
          dpkg-query -W > "$RESULTS/os-packages.txt"
      - name: Build
        run: cargo build --release --locked
      - name: Measure registered Linux configurations
        run: |
          mkdir -p "$RESULTS"
          xvfb-run -a python3 scripts/bench_compare.py \
            --bruster target/release/bruster --node "$(command -v node)" \
            --chrome "$BENCH_CHROME" --shell "$BENCH_SHELL" \
            --deps "$BENCH_DEPS" --output "$RESULTS" --rounds 10 --iterations 10 \
            2>&1 | tee "$RESULTS/measurement.log"
      - name: Inventory runtime files
        run: |
          python3 scripts/bench_footprint.py \
            --bruster target/release/bruster --node "$(command -v node)" \
            --chrome "$BENCH_CHROME" --shell "$BENCH_SHELL" \
            --deps "$BENCH_DEPS" --samples "$RESULTS/samples.json" \
            --output "$RESULTS/footprint.json"
      - name: Validate and render measurements
        run: |
          python3 scripts/bench_report.py prepare --results "$RESULTS"
          cat "$RESULTS/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw evidence (including failed runs)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-results/
          retention-days: 90
          if-no-files-found: warn
      - name: Publish versioned results to gh-pages
        run: python3 scripts/bench_publish.py --results "$RESULTS" --checkout "$RUNNER_TEMP/benchmark-site"
