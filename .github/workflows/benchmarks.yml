name: benchmarks
run-name: Paired published releases v0.3.3 vs v0.3.4

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release-comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the common browser runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev xvfb xauth fonts-dejavu-core
          mkdir -p "$RUNNER_TEMP/release-comparison"
          dpkg-query -W > "$RUNNER_TEMP/release-comparison/os-packages.txt"
      - name: Download and verify both published release binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for version in 0.3.3 0.3.4; do
            dir="$RUNNER_TEMP/releases/$version"
            mkdir -p "$dir"
            gh release download "v$version" --repo aliilyas/bruster --dir "$dir" \
              --pattern "bruster-$version-x86_64-unknown-linux-gnu.tar.gz" --pattern SHA256SUMS
            (cd "$dir" && sha256sum --check --ignore-missing SHA256SUMS)
            tar xzf "$dir/bruster-$version-x86_64-unknown-linux-gnu.tar.gz" -C "$dir"
            cp "$dir/SHA256SUMS" "$RUNNER_TEMP/release-comparison/SHA256SUMS-$version"
          done
      - name: Compare forty alternating pairs with full correctness checks
        run: |
          xvfb-run -a python scripts/bench_release.py \
            --baseline "$RUNNER_TEMP/releases/0.3.3/bruster-0.3.3-x86_64-unknown-linux-gnu/bruster" \
            --candidate "$RUNNER_TEMP/releases/0.3.4/bruster-0.3.4-x86_64-unknown-linux-gnu/bruster" \
            --output "$RUNNER_TEMP/release-comparison" --rounds 40 \
            2>&1 | tee "$RUNNER_TEMP/release-comparison/measurement.log"
          cat "$RUNNER_TEMP/release-comparison/report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Retain all samples, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-release-v0.3.3-v0.3.4
          path: ${{ runner.temp }}/release-comparison/
          retention-days: 90
          if-no-files-found: error
