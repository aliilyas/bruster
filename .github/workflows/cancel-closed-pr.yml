name: cancel closed PR runs

on:
  pull_request_target:
    types: [closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Use trusted workflow code and API metadata; no PR checkout is needed.
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr.head.repo) {
              core.info('The PR head repository is no longer available.');
              return;
            }

            const closedAt = Date.parse(pr.closed_at);
            const runs = new Map();
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const active = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo,
                branch: pr.head.ref,
                status,
                per_page: 100,
              });
              for (const run of active) runs.set(run.id, run);
            }

            for (const run of runs.values()) {
              if (run.id === context.runId || run.head_repository?.id !== pr.head.repo.id) continue;
              if (run.head_branch !== pr.head.ref || !['push', 'pull_request'].includes(run.event)) continue;
              if (Date.parse(run.created_at) > closedAt) continue;
              if (run.run_attempt > 1 && Date.parse(run.run_started_at) > closedAt) continue;
              if (run.pull_requests?.some(other => other.number !== pr.number)) continue;
              if (run.event === 'push' && run.head_branch === context.payload.repository.default_branch) continue;

              try {
                await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                core.info(`Requested cancellation of ${run.name} (${run.id}).`);
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} is already finished or cancelling.`);
              }
            }
