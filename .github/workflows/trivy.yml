name: Trivy

on:
  push:
  pull_request:
  schedule:
    - cron: '38 6 * * *' # Daily at 06:38 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: trivy
      - name: Scan repository dependencies including development dependencies
        shell: bash
        run: trivy fs --scanners vuln --include-dev-deps --no-progress --exit-code 1 . 2>&1 | tee trivy.txt
      - name: Retain vulnerability results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-results
          path: trivy.txt
          retention-days: 30
