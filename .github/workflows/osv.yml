name: OSV-Scanner

on:
  push:
  pull_request:
  schedule:
    - cron: '33 6 * * *' # Daily at 06:33 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install OSV-Scanner
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: osv-scanner
      - name: Scan repository dependencies
        shell: bash
        run: osv-scanner scan source --recursive . 2>&1 | tee osv-scanner.txt
      - name: Retain vulnerability results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osv-scanner-results
          path: osv-scanner.txt
          retention-days: 30
