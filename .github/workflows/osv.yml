name: OSV-Scanner

on:
  push:
  pull_request:
  schedule:
    - cron: '33 6 * * *' # Daily at 06:33 UTC.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OSV-Scanner
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: osv-scanner
      - name: Scan repository dependencies
        shell: bash
        run: osv-scanner scan source --recursive . 2>&1 | tee osv-scanner.txt
      - name: Retain vulnerability results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scanner-results
          path: osv-scanner.txt
          retention-days: 30
